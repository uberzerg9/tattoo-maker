# Pull requests: all checks, then a Hosting preview channel with saving switched off.
# Only Hosting is deployed. Rules, indexes, Storage and Functions are never touched from a pull request.
name: Pull request

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  preview:
    needs: checks
    # Pull requests from forks get no secrets, so there is nothing to deploy with.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The project comes from .firebaserc, so a later split into separate dev and prod projects needs no change here.
      - name: Read the project id
        id: project
        run: echo "id=$(node -p "require('./.firebaserc').projects.dev")" >> "$GITHUB_OUTPUT"

      # The preview runs against the real project, so it is built read-only: no Firestore or Storage writes,
      # no sign-ups, and a "Preview — saving disabled" badge.
      - name: Build (saving disabled)
        run: npm run build
        env:
          VITE_DISABLE_WRITES: "true"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}

      # A pull-request channel (pr<number>), removed after a week. Uses a service account that can only deploy Hosting.
      - name: Deploy to a preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PREVIEW }}
          projectId: ${{ steps.project.outputs.id }}
          expires: 7d
